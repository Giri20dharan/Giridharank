<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ESP32 IoT Control</title>


    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #dff6ff,
                #ffffff
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 90%;

            max-width: 900px;

            text-align: center;

        }


        h1 {

            color: #123c69;

            font-size: 36px;

            margin-bottom: 10px;

        }


        .subtitle {

            color: #555;

            margin-bottom: 25px;

        }


        .status {

            display: inline-block;

            padding: 10px 20px;

            border-radius: 20px;

            background: #eeeeee;

            margin-bottom: 30px;

            font-weight: bold;

        }


        .cards {

            display: flex;

            justify-content: center;

            gap: 20px;

            flex-wrap: wrap;

        }


        .card {

            background: white;

            width: 270px;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.12);

        }


        .icon {

            font-size: 45px;

        }


        .card h2 {

            color: #444;

        }


        .value {

            font-size: 42px;

            font-weight: bold;

            color: #1677c8;

        }


        .unit {

            font-size: 20px;

            color: #555;

        }


        /* RELAY */

        .relay-card {

            margin: 25px auto;

            max-width: 570px;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.12);

        }


        .relay-status {

            font-size: 28px;

            font-weight: bold;

            margin: 20px;

        }


        .relay-button {

            width: 220px;

            padding: 15px;

            font-size: 20px;

            font-weight: bold;

            border: none;

            border-radius: 30px;

            cursor: pointer;

            transition: 0.2s;

        }


        .relay-on {

            background: #28a745;

            color: white;

        }


        .relay-off {

            background: #dc3545;

            color: white;

        }


        .relay-button:hover {

            transform: scale(1.05);

        }


        .last-update {

            margin-top: 20px;

            color: #666;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>🌡️ ESP32 IoT Monitoring</h1>


    <p class="subtitle">

        DHT11 + OLED + Firebase + Relay Control

    </p>


    <div class="status"
         id="connectionStatus">

        🔄 Connecting...

    </div>


    <!-- SENSOR CARDS -->

    <div class="cards">


        <!-- TEMPERATURE -->

        <div class="card">

            <div class="icon">
                🌡️
            </div>

            <h2>
                Temperature
            </h2>

            <span class="value"
                  id="temperature">

                --.-

            </span>

            <span class="unit">
                °C
            </span>

        </div>


        <!-- HUMIDITY -->

        <div class="card">

            <div class="icon">
                💧
            </div>

            <h2>
                Humidity
            </h2>

            <span class="value"
                  id="humidity">

                --.-

            </span>

            <span class="unit">
                %

            </span>

        </div>


    </div>


    <!-- RELAY CONTROL -->

    <div class="relay-card">

        <div class="icon">
            ⚡
        </div>


        <h2>
            Relay Control
        </h2>


        <div class="relay-status"
             id="relayStatus">

            Relay OFF

        </div>


        <button
            class="relay-button relay-off"
            id="relayButton"
            onclick="toggleRelay()">

            TURN ON

        </button>

    </div>


    <div class="last-update">

        Last Sensor Update:

        <span id="lastUpdate">
            Waiting...
        </span>

    </div>


</div>


<script>


// =====================================================
// FIREBASE CONFIGURATION
// =====================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDvyGhJND3Ep9919srDH0TCkyf1Mdn9kUA",

    authDomain:
        "dht-sensor--rit.firebaseapp.com",

    databaseURL:
        "https://dht-sensor--rit-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "dht-sensor--rit",

    storageBucket:
        "dht-sensor--rit.firebasestorage.app",

    messagingSenderId:
        "948304978396",

    appId:
        "1:948304978396:web:87c7229b3382d1e995ef19",

    measurementId:
        "G-XZHYWHF28K"
};


// =====================================================
// INITIALIZE FIREBASE
// =====================================================

firebase.initializeApp(firebaseConfig);


const auth =
    firebase.auth();


const database =
    firebase.database();


// =====================================================
// HTML ELEMENTS
// =====================================================

const temperatureElement =
    document.getElementById("temperature");


const humidityElement =
    document.getElementById("humidity");


const connectionStatus =
    document.getElementById("connectionStatus");


const relayStatus =
    document.getElementById("relayStatus");


const relayButton =
    document.getElementById("relayButton");


const lastUpdate =
    document.getElementById("lastUpdate");


// =====================================================
// ANONYMOUS LOGIN
// =====================================================

auth.signInAnonymously()

.then(() => {

    console.log(
        "Anonymous login successful"
    );


    connectionStatus.innerHTML =
        "🟢 Firebase Connected";


    connectionStatus.style.background =
        "#d4edda";


    connectionStatus.style.color =
        "#155724";


    startFirebase();

})


.catch((error) => {

    console.error(error);


    connectionStatus.innerHTML =
        "🔴 Firebase Connection Failed";


    connectionStatus.style.background =
        "#f8d7da";


    connectionStatus.style.color =
        "#721c24";

});


// =====================================================
// FIREBASE DATA
// =====================================================

function startFirebase()
{

    // -----------------------------------------------
    // TEMPERATURE
    // -----------------------------------------------

    database
        .ref("/DHT11/temperature")
        .on("value", function(snapshot)
        {

            const value =
                snapshot.val();


            if (value !== null)
            {

                temperatureElement.innerText =
                    Number(value).toFixed(1);

                updateTime();

            }

        });


    // -----------------------------------------------
    // HUMIDITY
    // -----------------------------------------------

    database
        .ref("/DHT11/humidity")
        .on("value", function(snapshot)
        {

            const value =
                snapshot.val();


            if (value !== null)
            {

                humidityElement.innerText =
                    Number(value).toFixed(1);

                updateTime();

            }

        });


    // -----------------------------------------------
    // RELAY STATUS
    // -----------------------------------------------

    database
        .ref("/Relay/state")
        .on("value", function(snapshot)
        {

            const state =
                snapshot.val();


            updateRelayButton(
                state === true
            );

        });

}


// =====================================================
// RELAY BUTTON
// =====================================================

function toggleRelay()
{

    database
        .ref("/Relay/state")
        .once("value")
        .then(function(snapshot)
        {

            const currentState =
                snapshot.val() === true;


            const newState =
                !currentState;


            return database
                .ref("/Relay/state")
                .set(newState);

        })

        .then(function()
        {

            console.log(
                "Relay command sent"
            );

        })

        .catch(function(error)
        {

            console.error(
                "Relay error:",
                error
            );

        });

}


// =====================================================
// UPDATE BUTTON
// =====================================================

function updateRelayButton(isON)
{

    if (isON)
    {

        relayStatus.innerText =
            "Relay ON";

        relayStatus.style.color =
            "#28a745";


        relayButton.innerText =
            "TURN OFF";


        relayButton.className =
            "relay-button relay-on";

    }

    else
    {

        relayStatus.innerText =
            "Relay OFF";

        relayStatus.style.color =
            "#dc3545";


        relayButton.innerText =
            "TURN ON";


        relayButton.className =
            "relay-button relay-off";

    }

}


// =====================================================
// UPDATE TIME
// =====================================================

function updateTime()
{

    const now =
        new Date();


    lastUpdate.innerText =
        now.toLocaleTimeString();

}

</script>


</body>

</html>
